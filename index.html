<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf8f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14131a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Bible · 14 editions</title>
    <script>
      // Capture the PWA install prompt as soon as the browser offers it. It can fire
      // before the app bundle mounts (a warm repeat visit), so stash it on window and
      // let the app read it on mount; without this the footer Install button can miss it.
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault()
        window.__bip = e
      })
      window.addEventListener('appinstalled', function () {
        window.__bip = null
      })
    </script>
    <!--
      Splash screen. Lives in the document (not in a component) and is styled inline
      so it paints on the very first frame, before the JS bundle or styles.css load —
      which is the whole point on a cold PWA start. React replaces #root's children
      when it mounts, so there is nothing to tear down.
    -->
    <style>
      :root {
        --sbg: #faf8f4;
        --sfg: #1f2430;
        --smuted: #666c7d;   /* 4.94:1 — the token file's value. #8a8f9c was 3.05:1 */
        --saccent: #4338ca;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --sbg: #14131a;
          --sfg: #e9e6df;
          --smuted: #8c8a95;
          --saccent: #a9a2ff;
        }
      }
      html,
      body {
        margin: 0;
        background: var(--sbg);
      }
      #splash {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 32px 20px calc(env(safe-area-inset-bottom) + 32px + 7vh);
        box-sizing: border-box;
        color: var(--sfg);
        font-family: ui-serif, Georgia, 'Times New Roman', 'Yu Mincho', 'Hiragino Mincho ProN', serif;
      }
      /* The same object as the installed icon, at the size it sits in the launcher,
         so the splash reads as that icon growing into the app rather than a new screen.
         No fade: the handoff to React should be invisible, and a 0.5s fade guarantees
         it is not. */
      #splash .stile {
        width: 72px;
        height: 72px;
        flex: none;
        border-radius: 22px;
        /* Fixed, not themed: this is the launcher icon, and that does not
           repaint when the OS switches to dark. */
        background: #4338ca;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #splash .smark {
        width: 72px;
        height: 72px;
        display: block;
        fill: #faf8f4;
      }
      #splash h1 {
        margin: 0;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      #splash .stag {
        margin: -12px 0 0;
        font-family: system-ui, sans-serif;
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--smuted);
      }
      #splash .sload {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-top: 6px;
        font-family: system-ui, sans-serif;
        font-size: 12px;
        color: var(--smuted);
      }
      #splash .sdot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--saccent);
        animation: spulse 1.1s ease-in-out infinite;
      }
      @keyframes spulse {
        0%, 100% { opacity: 0.25; transform: scale(0.8) }
        50% { opacity: 1; transform: scale(1) }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .sdot { animation: none; opacity: 0.6 }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash">
        <div class="stile">
          <svg class="smark" viewBox="0 0 512 512" aria-hidden="true">
            <rect x="227.5" y="61" width="56.9" height="390" rx="14.8" />
            <rect x="135.5" y="181.5" width="241" height="56.9" rx="14.8" />
          </svg>
        </div>
        <h1>Bible</h1>
        <p class="stag">14 editions · offline</p>
        <p class="sload"><span class="sdot"></span> Loading…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
